<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castle on the Hill</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #cfe3f5; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #title {
      position: fixed; left: 18px; bottom: 14px; font: 14px/1.4 Georgia, "Times New Roman", serif;
      color: rgba(255,255,255,0.85); text-shadow: 0 1px 3px rgba(0,0,0,0.6); pointer-events: none;
      letter-spacing: 0.06em;
    }
    #nowebgl {
      display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
      font: 16px sans-serif; color: #333; background: #cfe3f5; padding: 24px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="title">Castle on the Hill &mdash; the camera circles on its own</div>
  <div id="nowebgl">This animation needs a browser with WebGL enabled.</div>
  <!-- three.js r170 repackaged as a plain script so this works when opened directly from disk (file://). -->
  <script src="lib/three.global.js"></script>
  <script>
    (function () {
      var c = document.createElement('canvas');
      var ok = !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
      if (!ok) { document.getElementById('nowebgl').style.display = 'flex'; window.__noWebGL = true; }
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
