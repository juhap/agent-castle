<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medieval Castle on a Forested Hill</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0b1020;
  }
  #scene {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc4e8);
scene.fog = new THREE.Fog(0x9fc4e8, 260, 620);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 1500
);

// ---------------------------------------------------------------------------
// Lights
// ---------------------------------------------------------------------------
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(120, 160, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -180;
sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180;
sun.shadow.camera.bottom = -180;
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 500;
sun.shadow.bias = -0.0004;
scene.add(sun);

scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x51663f, 0.85));

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
const matStone = new THREE.MeshStandardMaterial({ color: 0x8d8d94, roughness: 0.95 });
const matStoneDark = new THREE.MeshStandardMaterial({ color: 0x63636c, roughness: 0.95 });
const matRoof = new THREE.MeshStandardMaterial({ color: 0x7a3b2e, roughness: 0.85 });
const matWood = new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 0.9 });
const matFlag = new THREE.MeshStandardMaterial({
  color: 0xb02a2a, roughness: 0.7, side: THREE.DoubleSide
});
const matGrass = new THREE.MeshStandardMaterial({ color: 0x4e7d3a, roughness: 1.0 });
const matTrunk = new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 1.0 });
const matLeaf = new THREE.MeshStandardMaterial({ color: 0x2f5d2a, roughness: 1.0 });

// ---------------------------------------------------------------------------
// Hill + ground
// ---------------------------------------------------------------------------
const HILL_R = 46, HILL_H = 16;

function hillHeight(x, z) {
  const d = Math.sqrt(x * x + z * z);
  const t = Math.min(d / HILL_R, 1);
  // smooth dome with a flatter plateau on top for the castle
  return HILL_H * Math.pow(1 - t * t, 1.35) + HILL_H * 0.12 * Math.max(0, 1 - d / 12);
}

const groundGeo = new THREE.PlaneGeometry(1200, 1200, 160, 160);
groundGeo.rotateX(-Math.PI / 2);
{
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, hillHeight(x, z));
  }
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, matGrass);
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Castle
// ---------------------------------------------------------------------------
const castle = new THREE.Group();
scene.add(castle);

const TOP_Y = hillHeight(0, 0); // plateau height at the centre

function box(w, h, d, x, y, z, mat, ry = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = true;
  m.receiveShadow = true;
  castle.add(m);
  return m;
}

function cylinder(rTop, rBottom, h, seg, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  castle.add(m);
  return m;
}

// Merlons (battlements) placed along a straight wall segment
function merlonRow(x1, z1, x2, z2, y, alongX) {
  const len = Math.hypot(x2 - x1, z2 - z1);
  const n = Math.max(2, Math.round(len / 3.2));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(alongX ? 1.9 : 1.4, 1.7, alongX ? 1.4 : 1.9),
      matStoneDark
    );
    m.position.set(x1 + (x2 - x1) * t, y, z1 + (z2 - z1) * t);
    m.castShadow = true;
    m.receiveShadow = true;
    castle.add(m);
  }
}

// Merlons around a round tower top
function merlonRing(cx, cz, radius, y, count) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.7, 1.4), matStoneDark);
    m.position.set(cx + Math.cos(a) * radius, y, cz + Math.sin(a) * radius);
    m.rotation.y = -a + Math.PI / 4;
    m.castShadow = true;
    castle.add(m);
  }
}

// --- Curtain walls (square ring around the keep) ---
// Each wall is sunk into the sloped ground so nothing floats.
const WALL_H = 11, WALL_T = 2.4, WALL_HALF = 17, SINK = 6;
function wallAlong(cx, cz, alongX) {
  const g = hillHeight(cx, cz);
  const len = WALL_HALF * 2;
  if (alongX) {
    box(len, WALL_H + SINK, WALL_T, cx, g + WALL_H / 2 - SINK / 2, cz, matStone);
    merlonRow(cx - WALL_HALF + 1.2, cz, cx + WALL_HALF - 1.2, cz, g + WALL_H + 0.85, true);
  } else {
    box(WALL_T, WALL_H + SINK, len, cx, g + WALL_H / 2 - SINK / 2, cz, matStone);
    merlonRow(cx, cz - WALL_HALF + 1.2, cx, cz + WALL_HALF - 1.2, g + WALL_H + 0.85, false);
  }
}
wallAlong(0, -WALL_HALF, true);   // north
wallAlong(0, WALL_HALF, true);    // south
wallAlong(-WALL_HALF, 0, false);  // west
wallAlong(WALL_HALF, 0, false);   // east

// --- Corner towers ---
const TOWER_R = 4.2, TOWER_H = 20;
const towerPositions = [
  [-WALL_HALF, -WALL_HALF], [WALL_HALF, -WALL_HALF],
  [-WALL_HALF, WALL_HALF], [WALL_HALF, WALL_HALF]
];
for (const [tx, tz] of towerPositions) {
  const base = hillHeight(tx, tz);
  cylinder(TOWER_R, TOWER_R * 1.12, TOWER_H + SINK, 14,
    tx, base + TOWER_H / 2 - SINK / 2, tz, matStone);
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(TOWER_R * 1.35, 7.5, 14), matRoof);
  roof.position.set(tx, base + TOWER_H + 3.75, tz);
  roof.castShadow = true;
  castle.add(roof);
}

// --- Gatehouse on the south wall ---
const gateG = hillHeight(0, WALL_HALF);
box(7.5, WALL_H + 3 + SINK, 5, 0, gateG + (WALL_H + 3) / 2 - SINK / 2, WALL_HALF, matStoneDark);
merlonRow(-3, WALL_HALF, 3, WALL_HALF, gateG + WALL_H + 3 + 0.85, true);
{
  // arched doorway with portcullis
  const door = new THREE.Mesh(new THREE.BoxGeometry(3.2, 5.6, 1), matWood);
  door.position.set(0, gateG + 2.8, WALL_HALF + 2.51);
  door.castShadow = true;
  castle.add(door);
  for (let i = -1; i <= 1; i++) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.22, 5.6, 0.22), matStoneDark);
    bar.position.set(i * 0.95, gateG + 2.8, WALL_HALF + 2.65);
    castle.add(bar);
  }
  const arch = new THREE.Mesh(
    new THREE.CylinderGeometry(1.6, 1.6, 1.2, 12, 1, false, 0, Math.PI), matWood);
  arch.rotation.z = Math.PI / 2;
  arch.rotation.y = Math.PI / 2;
  arch.position.set(0, gateG + 5.6, WALL_HALF + 2.51);
  castle.add(arch);
}

// --- Central keep ---
const KEEP_W = 13, KEEP_D = 13, KEEP_H = 26;
box(KEEP_W, KEEP_H + SINK, KEEP_D, 0, TOP_Y + KEEP_H / 2 - SINK / 2, 0, matStone);
// keep windows
for (const wz of [-4.4, 0, 4.4]) {
  for (const wy of [TOP_Y + 8, TOP_Y + 15, TOP_Y + 21]) {
    for (const sx of [-1, 1]) {
      const win = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.2, 0.4), matStoneDark);
      win.position.set(sx * (KEEP_W / 2 + 0.2), wy, wz);
      castle.add(win);
    }
  }
}
{
  const door = new THREE.Mesh(new THREE.BoxGeometry(2.6, 4.6, 0.5), matWood);
  door.position.set(0, TOP_Y + 2.3, KEEP_D / 2 + 0.2);
  castle.add(door);
  // pyramidal roof
  const roof = new THREE.Mesh(new THREE.ConeGeometry(KEEP_W * 0.78, 8, 4), matRoof);
  roof.position.set(0, TOP_Y + KEEP_H + 4, 0);
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  castle.add(roof);
}

// --- Main flag tower (tallest, in the courtyard's back corner) ---
const FLAG_X = -11.5, FLAG_Z = -11.5;
const flagBase = hillHeight(FLAG_X, FLAG_Z);
const flagTowerH = 34;
cylinder(3.0, 3.5, flagTowerH + SINK, 12,
  FLAG_X, flagBase + flagTowerH / 2 - SINK / 2, FLAG_Z, matStone);
merlonRing(FLAG_X, FLAG_Z, 3.0, flagBase + flagTowerH + 0.85, 8);
{
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.9, 6.5, 12), matRoof);
  roof.position.set(FLAG_X, flagBase + flagTowerH + 3.25, FLAG_Z);
  roof.castShadow = true;
  castle.add(roof);
}

// ---------------------------------------------------------------------------
// Waving flag on top of the flag tower
// ---------------------------------------------------------------------------
const FLAG_POLE_TOP = flagBase + flagTowerH + 6.5 + 2.4; // above the cone roof
const pole = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.12, 4.6, 8), matWood);
pole.position.set(FLAG_X, FLAG_POLE_TOP - 2.3, FLAG_Z);
pole.castShadow = true;
castle.add(pole);
{
  const knob = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0xd8b23a, roughness: 0.4, metalness: 0.6 }));
  knob.position.set(FLAG_X, FLAG_POLE_TOP + 0.1, FLAG_Z);
  castle.add(knob);
}

const FLAG_W = 7.5, FLAG_H = 4.2, SEG_X = 24, SEG_Y = 10;
const flagGeo = new THREE.PlaneGeometry(FLAG_W, FLAG_H, SEG_X, SEG_Y);
flagGeo.translate(FLAG_W / 2, 0, 0); // x = 0 edge attaches to the pole
const flagBasePos = flagGeo.attributes.position.array.slice();
const flag = new THREE.Mesh(flagGeo, matFlag);
flag.position.set(FLAG_X, FLAG_POLE_TOP - FLAG_H / 2 - 0.3, FLAG_Z);
flag.castShadow = true;
scene.add(flag);

// pale emblem panel that rides on the cloth
const emblem = new THREE.Mesh(
  new THREE.PlaneGeometry(FLAG_W * 0.5, FLAG_H * 0.55),
  new THREE.MeshStandardMaterial({
    color: 0xe8d9a0, roughness: 0.7, side: THREE.DoubleSide, transparent: true, opacity: 0.95
  })
);
scene.add(emblem);

function updateFlag(time) {
  const pos = flagGeo.attributes.position;
  const arr = pos.array;
  for (let i = 0; i < pos.count; i++) {
    const bx = flagBasePos[i * 3];
    const by = flagBasePos[i * 3 + 1];
    const t = bx / FLAG_W; // 0 at pole, 1 at the free edge
    const wave =
      Math.sin(bx * 1.4 - time * 5.0) * 0.55 * t +
      Math.sin(bx * 2.6 - time * 8.0 + by * 1.2) * 0.22 * t;
    const lift = Math.sin(time * 3.2 + by * 0.8) * 0.12 * t;
    arr[i * 3] = bx;
    arr[i * 3 + 1] = by + lift;
    arr[i * 3 + 2] = wave;
  }
  pos.needsUpdate = true;
  flagGeo.computeVertexNormals();

  // emblem follows the cloth near its centre
  const cx = FLAG_W * 0.28;
  const cz =
    Math.sin(cx * 1.4 - time * 5.0) * 0.55 * (cx / FLAG_W) +
    Math.sin(cx * 2.6 - time * 8.0) * 0.22 * (cx / FLAG_W);
  emblem.position.set(
    FLAG_X + cx,
    FLAG_POLE_TOP - FLAG_H / 2 - 0.3,
    FLAG_Z + 0.03 + cz
  );
  emblem.rotation.y = Math.sin(time * 2.0) * 0.05;
}

// ---------------------------------------------------------------------------
// Forest — instanced trees scattered over the hill slopes and plains
// ---------------------------------------------------------------------------
const TREE_COUNT = 420;
const trunks = new THREE.InstancedMesh(
  new THREE.CylinderGeometry(0.35, 0.55, 4, 7), matTrunk, TREE_COUNT);
const leaves = new THREE.InstancedMesh(
  new THREE.ConeGeometry(2.6, 7, 8), matLeaf, TREE_COUNT);
trunks.castShadow = true;
leaves.castShadow = true;
trunks.receiveShadow = true;

const dummy = new THREE.Object3D();
let seed = 1337;
function rand() { // deterministic PRNG so the forest layout is stable
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

let placed = 0;
for (let i = 0; i < TREE_COUNT; i++) {
  let x, z, tries = 0;
  do {
    const a = rand() * Math.PI * 2;
    const r = 30 + Math.pow(rand(), 0.7) * 480; // clear of the castle plateau
    x = Math.cos(a) * r;
    z = Math.sin(a) * r;
    tries++;
  } while (Math.hypot(x, z) < 26 && tries < 20);

  const y = hillHeight(x, z);
  const s = 0.75 + rand() * 0.9;
  dummy.position.set(x, y + 2 * s, z);
  dummy.rotation.set((rand() - 0.5) * 0.08, rand() * Math.PI * 2, (rand() - 0.5) * 0.08);
  dummy.scale.set(s, s * (0.9 + rand() * 0.4), s);
  dummy.updateMatrix();
  trunks.setMatrixAt(placed, dummy.matrix);

  dummy.position.y = y + 7.5 * s;
  dummy.updateMatrix();
  leaves.setMatrixAt(placed, dummy.matrix);
  placed++;
}
trunks.count = placed;
leaves.count = placed;
scene.add(trunks);
scene.add(leaves);

// rocks scattered on the slopes
const rocks = new THREE.InstancedMesh(
  new THREE.DodecahedronGeometry(1, 0), matStoneDark, 40);
for (let i = 0; i < 40; i++) {
  const a = rand() * Math.PI * 2;
  const r = 26 + rand() * 200;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const s = 0.4 + rand() * 1.4;
  dummy.position.set(x, hillHeight(x, z) + s * 0.3, z);
  dummy.rotation.set(rand() * 3, rand() * 3, rand() * 3);
  dummy.scale.set(s, s * 0.7, s);
  dummy.updateMatrix();
  rocks.setMatrixAt(i, dummy.matrix);
}
rocks.castShadow = true;
scene.add(rocks);

// ---------------------------------------------------------------------------
// Sky: gradient dome + drifting clouds
// ---------------------------------------------------------------------------
{
  const skyGeo = new THREE.SphereGeometry(900, 24, 12);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x3f7fd1) },
      bottom: { value: new THREE.Color(0xdcebf7) }
    },
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 top; uniform vec3 bottom;
      varying vec3 vPos;
      void main() {
        float h = normalize(vPos).y * 0.5 + 0.5;
        gl_FragColor = vec4(mix(bottom, top, pow(h, 0.8)), 1.0);
      }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
}

const clouds = new THREE.Group();
{
  const cloudMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 1, transparent: true, opacity: 0.85, flatShading: true
  });
  for (let c = 0; c < 8; c++) {
    const cl = new THREE.Group();
    const n = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const puff = new THREE.Mesh(
        new THREE.SphereGeometry(6 + Math.random() * 7, 8, 6), cloudMat);
      puff.position.set((i - n / 2) * 7 + Math.random() * 4, Math.random() * 3, Math.random() * 5);
      puff.scale.y = 0.55;
      cl.add(puff);
    }
    const a = Math.random() * Math.PI * 2;
    const r = 220 + Math.random() * 260;
    cl.position.set(Math.cos(a) * r, 90 + Math.random() * 70, Math.sin(a) * r);
    clouds.add(cl);
  }
  scene.add(clouds);
}

// ---------------------------------------------------------------------------
// Camera orbit — no keyboard controls, the camera spins around the castle
// ---------------------------------------------------------------------------
const ORBIT_R = 95;
const ORBIT_H = 48;
function updateCamera(time) {
  const a = time * 0.12; // slow full revolution showing every side
  camera.position.set(
    Math.cos(a) * ORBIT_R,
    ORBIT_H + Math.sin(time * 0.25) * 4,
    Math.sin(a) * ORBIT_R
  );
  camera.lookAt(0, TOP_Y + 12, 0);
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  updateFlag(t);
  updateCamera(t);
  clouds.children.forEach((c, i) => {
    c.position.x += 0.02 + Math.sin(t * 0.05 + i) * 0.008;
  });
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
