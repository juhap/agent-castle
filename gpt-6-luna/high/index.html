<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a9c9d2">
  <title>Highwood Keep — A living diorama</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #a9c9d2; }
    canvas { display: block; width: 100%; height: 100%; }
    .title-card { position: fixed; z-index: 2; left: clamp(22px, 5vw, 76px); top: clamp(24px, 6vh, 70px); color: #f5eddb; pointer-events: none; text-shadow: 0 2px 18px #172c28a8; }
    .eyebrow { margin: 0 0 10px; font: 600 10px/1.2 system-ui, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: #e9cf95; }
    h1 { margin: 0; font-weight: 400; font-size: clamp(32px, 5vw, 65px); letter-spacing: .025em; line-height: .96; }
    .subtitle { margin: 14px 0 0; font: 400 12px/1.5 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #f2ead8d9; }
    .caption { position: fixed; right: clamp(22px, 5vw, 76px); bottom: 32px; z-index: 2; color: #f4ead4; font: 500 10px/1.5 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; text-align: right; text-shadow: 0 1px 12px #142c27; pointer-events: none; }
    .caption span { display: block; color: #e9cf95; font-size: 9px; }
    #error { display: none; position: fixed; inset: 0; place-items: center; padding: 32px; color: #fff; background: #172c28; font: 16px system-ui, sans-serif; text-align: center; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.164.1/build/three.module.js" } }
  </script>
</head>
<body>
  <div class="title-card">
    <p class="eyebrow">Beyond the old road</p>
    <h1>Highwood<br>Keep</h1>
    <p class="subtitle">A quiet kingdom in the pines</p>
  </div>
  <div class="caption">The northern marches<span>Year of the green banner · 1248</span></div>
  <div id="error">This scene needs WebGL and an internet connection to load its 3D engine.</div>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const sky = new THREE.Color('#a9c9d2');
    scene.background = sky;
    scene.fog = new THREE.Fog('#a9c9d2', 62, 155);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 260);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight('#eff8f2', '#384632', 2.0));
    const sun = new THREE.DirectionalLight('#ffe6b0', 3.1);
    sun.position.set(-34, 54, 28);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -42; sun.shadow.camera.right = 42;
    sun.shadow.camera.top = 48; sun.shadow.camera.bottom = -42;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    const mats = {
      grass: new THREE.MeshStandardMaterial({ color: '#627853', roughness: 1 }),
      stone: new THREE.MeshStandardMaterial({ color: '#aaa18a', roughness: .94 }),
      trim: new THREE.MeshStandardMaterial({ color: '#c0b69c', roughness: .9 }),
      shadowStone: new THREE.MeshStandardMaterial({ color: '#756e61', roughness: 1 }),
      roof: new THREE.MeshStandardMaterial({ color: '#394a43', roughness: .82 }),
      roofLight: new THREE.MeshStandardMaterial({ color: '#4a5b4c', roughness: .86 }),
      wood: new THREE.MeshStandardMaterial({ color: '#624631', roughness: .9 }),
      dark: new THREE.MeshStandardMaterial({ color: '#202b28', roughness: 1 }),
      gold: new THREE.MeshStandardMaterial({ color: '#d5ad60', metalness: .34, roughness: .5 })
    };

    function hillHeight(x, z) {
      const r = Math.hypot(x, z);
      const t = THREE.MathUtils.clamp((r - 7.2) / 19.5, 0, 1);
      const eased = t * t * (3 - 2 * t);
      const texture = (Math.sin(x * .52 + z * .19) + Math.sin(z * .39 - x * .23)) * .10;
      return r < 7.2 ? 3.45 : Math.max(0.08, 3.45 * (1 - eased) + texture * Math.sin(Math.PI * t));
    }

    // A softly rounded, grassy mound with a broad level crown for the fortress.
    const hillGeo = new THREE.BufferGeometry();
    const hillVerts = [], hillIndices = [];
    const rings = 76, segments = 180, maxR = 28;
    for (let j = 0; j <= rings; j++) {
      const r = maxR * j / rings;
      for (let i = 0; i <= segments; i++) {
        const a = Math.PI * 2 * i / segments;
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        hillVerts.push(x, hillHeight(x, z), z);
        if (j < rings && i < segments) {
          const k = j * (segments + 1) + i, n = k + segments + 1;
          hillIndices.push(k, k + 1, n, n, k + 1, n + 1);
        }
      }
    }
    hillGeo.setAttribute('position', new THREE.Float32BufferAttribute(hillVerts, 3));
    hillGeo.setIndex(hillIndices); hillGeo.computeVertexNormals();
    const hill = new THREE.Mesh(hillGeo, mats.grass);
    hill.receiveShadow = true; scene.add(hill);

    const earth = new THREE.Mesh(new THREE.CircleGeometry(180, 128), new THREE.MeshStandardMaterial({ color: '#42543e', roughness: 1 }));
    earth.rotation.x = -Math.PI / 2; earth.position.y = -0.13; earth.receiveShadow = true; scene.add(earth);

    // Dense, varied pinewood around the hill, built as instanced meshes for smooth animation.
    let seed = 41723;
    const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const trunkGeo = new THREE.CylinderGeometry(.17, .28, 2.5, 7);
    const pineGeo = new THREE.ConeGeometry(1, 2.7, 8);
    const firGeo = new THREE.ConeGeometry(1, 3.4, 7);
    const trunkMat = new THREE.MeshStandardMaterial({ color: '#594632', roughness: 1 });
    const foliageMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1 });
    const treeColors = ['#29473c', '#355541', '#3e6048', '#49684b'].map(color => new THREE.Color(color));
    const treeData = [];
    for (let i = 0; i < 1900; i++) {
      const angle = rand() * Math.PI * 2;
      const radius = 24 + Math.sqrt(rand()) * 94;
      const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
      const scale = .68 + rand() * 1.12;
      treeData.push({ x, z, scale, color: Math.floor(rand() * treeColors.length) });
    }
    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeData.length);
    const canopies = [
      new THREE.InstancedMesh(pineGeo, foliageMat, treeData.length),
      new THREE.InstancedMesh(firGeo, foliageMat, treeData.length),
      new THREE.InstancedMesh(pineGeo, foliageMat, treeData.length)
    ];
    const dummy = new THREE.Object3D();
    for (let i = 0; i < treeData.length; i++) {
      const t = treeData[i], base = 0, h = 2.5 * t.scale;
      dummy.position.set(t.x, base + h * .5, t.z); dummy.scale.setScalar(t.scale); dummy.rotation.y = rand() * 6.28; dummy.updateMatrix(); trunks.setMatrixAt(i, dummy.matrix);
      for (let layer = 0; layer < 3; layer++) {
        const mesh = canopies[layer];
        const coneHeight = (layer === 1 ? 2.9 : 3.4) * t.scale;
        const y = base + h * .46 + layer * h * .33 + coneHeight * .28;
        dummy.position.set(t.x, y, t.z); dummy.scale.set(t.scale * (layer === 2 ? .76 : 1), t.scale, t.scale * (layer === 2 ? .76 : 1));
        dummy.rotation.set(0, rand() * 6.28, 0); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
        const tint = treeColors[t.color].clone().multiplyScalar(1 + (layer - 1) * .07);
        mesh.setColorAt(i, tint);
      }
    }
    trunks.castShadow = true;
    canopies.forEach(m => { m.castShadow = true; scene.add(m); });
    scene.add(trunks);

    function addMesh(geometry, material, x, y, z, sx = 1, sy = 1, sz = 1, cast = true) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z); mesh.scale.set(sx, sy, sz);
      mesh.castShadow = cast; mesh.receiveShadow = true; scene.add(mesh); return mesh;
    }
    const baseY = 3.48;
    function box(x, y, z, sx, sy, sz, mat = mats.stone) { return addMesh(new THREE.BoxGeometry(sx, sy, sz), mat, x, y, z); }

    // Curtain wall, raised stone footing, and regular merlons.
    box(0, baseY + .38, 0, 17.8, .76, 15.8, mats.shadowStone);
    const wallH = 5.8, wallY = baseY + .76 + wallH / 2;
    box(0, wallY, -7.75, 15.8, wallH, .82);
    // Leave a true opening in the south curtain wall for the arched gate.
    box(-4.825, wallY,  7.75, 6.15, wallH, .82);
    box( 4.825, wallY,  7.75, 6.15, wallH, .82);
    box(0, baseY + 5.55, 7.75, 3.5, 2.0, .82);
    box(-8.35, wallY, 0, .82, wallH, 14.9);
    box( 8.35, wallY, 0, .82, wallH, 14.9);
    const merlonGeo = new THREE.BoxGeometry(.78, .92, .9);
    for (let i = 0; i < 13; i++) {
      const p = -7.45 + i * 1.24;
      addMesh(merlonGeo, mats.trim, p, baseY + .76 + wallH + .42, -7.75, 1, 1, 1);
      addMesh(merlonGeo, mats.trim, p, baseY + .76 + wallH + .42,  7.75, 1, 1, 1);
      if (i > 0 && i < 12) {
        addMesh(merlonGeo, mats.trim, -8.35, baseY + .76 + wallH + .42, p, 1, 1, 1);
        addMesh(merlonGeo, mats.trim,  8.35, baseY + .76 + wallH + .42, p, 1, 1, 1);
      }
    }

    // Four round corner towers with stone collars and slate conical roofs.
    const towerGeo = new THREE.CylinderGeometry(1.82, 2.08, 9.1, 12, 1);
    const collarGeo = new THREE.CylinderGeometry(2.03, 2.03, .42, 12);
    const roofGeo = new THREE.ConeGeometry(2.26, 4.0, 12);
    for (const [x, z] of [[-8.3, -7.7], [8.3, -7.7], [-8.3, 7.7], [8.3, 7.7]]) {
      addMesh(towerGeo, mats.stone, x, baseY + 4.55, z);
      addMesh(collarGeo, mats.trim, x, baseY + 9.18, z);
      addMesh(roofGeo, mats.roof, x, baseY + 11.35, z);
      addMesh(new THREE.SphereGeometry(.22, 10, 8), mats.gold, x, baseY + 13.38, z, 1, 1.25, 1);
      // Tall, narrow arrow slits on the outward faces.
      for (const level of [baseY + 3.3, baseY + 6.1]) {
        box(x, level, z + (z > 0 ? 1.98 : -1.98), .22, 1.05, .08, mats.dark);
      }
    }

    // Main hall with buttresses, roof, dormers and a central keep tower.
    box(0, baseY + 3.58, -1.2, 8.7, 7.15, 6.2, mats.trim);
    box(0, baseY + 7.2, -1.2, 9.1, .38, 6.55, mats.stone);
    const hallRoof = new THREE.ConeGeometry(5.65, 4.4, 4);
    const hallTop = addMesh(hallRoof, mats.roof, 0, baseY + 9.33, -1.2);
    hallTop.rotation.y = Math.PI / 4;
    for (const x of [-4.05, 4.05]) {
      box(x, baseY + 2.8, 2.0, .72, 5.6, .85, mats.stone);
      box(x, baseY + 2.8, -4.4, .72, 5.6, .85, mats.stone);
    }
    // Keep tower rises well above the hall, making the banner visible from every side.
    const keepGeo = new THREE.CylinderGeometry(2.48, 2.72, 11.1, 12, 1);
    addMesh(keepGeo, mats.stone, 0, baseY + 9.0, -1.2);
    addMesh(new THREE.CylinderGeometry(2.78, 2.78, .48, 12), mats.trim, 0, baseY + 14.65, -1.2);
    const keepRoof = addMesh(new THREE.ConeGeometry(3.18, 5.6, 12), mats.roofLight, 0, baseY + 17.55, -1.2);
    addMesh(new THREE.SphereGeometry(.2, 10, 8), mats.gold, 0, baseY + 20.4, -1.2, 1, 1.4, 1);
    // Keep windows: dark recess, warm inset, stone hood.
    for (const y of [baseY + 6.2, baseY + 10.2, baseY + 13.2]) {
      for (const x of [-1.0, 1.0]) {
        box(x, y, 1.36, .36, 1.3, .12, mats.dark);
        box(x, y, 1.445, .16, .72, .035, new THREE.MeshStandardMaterial({ color: '#c79752', emissive: '#5b3513', emissiveIntensity: .55 }));
        box(x, y + .78, 1.4, .58, .12, .2, mats.trim);
      }
    }
    // The arch and timber gate face the southern approach.
    const arch = new THREE.Shape();
    arch.moveTo(-1.55, 0); arch.lineTo(1.55, 0); arch.lineTo(1.55, 2.4);
    arch.absarc(0, 2.4, 1.55, 0, Math.PI, false); arch.lineTo(-1.55, 0);
    const gate = new THREE.Mesh(new THREE.ExtrudeGeometry(arch, { depth: .34, bevelEnabled: true, bevelSegments: 1, bevelSize: .08, bevelThickness: .08 }), mats.wood);
    gate.position.set(0, baseY + .05, 7.94); gate.castShadow = true; gate.receiveShadow = true; scene.add(gate);
    box(-.76, baseY + 1.15, 8.34, .1, 2.1, .08, mats.gold);
    box(.76, baseY + 1.15, 8.34, .1, 2.1, .08, mats.gold);
    box(0, baseY + .55, 8.36, 1.55, .12, .08, mats.gold);
    // Stone path winding down into the pines.
    for (let i = 0; i < 24; i++) {
      const t = i / 23, z = 9 + t * 21, x = 1.1 * Math.sin(t * 5.3) - .5 * t;
      const y = hillHeight(x, z) + .07;
      const stone = addMesh(new THREE.BoxGeometry(2.3 - .4 * t, .13, 1.15), i % 3 ? mats.shadowStone : mats.trim, x, y, z, 1, 1, 1, false);
      stone.rotation.y = -.18 + .16 * Math.sin(t * 5.3);
    }

    // Pole, finial, and a double-sided cloth whose vertices catch the breeze.
    const poleX = 0, poleZ = -1.2, poleBase = baseY + 20.0, poleTop = baseY + 24.0;
    addMesh(new THREE.CylinderGeometry(.055, .075, poleTop - poleBase, 10), mats.gold, poleX, (poleBase + poleTop) / 2, poleZ);
    addMesh(new THREE.SphereGeometry(.13, 12, 8), mats.gold, poleX, poleTop, poleZ);
    const flagW = 3.55, flagH = 2.05;
    const flagGeo = new THREE.PlaneGeometry(flagW, flagH, 28, 16);
    const pos = flagGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) { pos.setX(i, pos.getX(i) + flagW / 2); pos.setY(i, pos.getY(i) - flagH / 2); }
    flagGeo.attributes.position.needsUpdate = true;
    const flagCanvas = document.createElement('canvas'); flagCanvas.width = 512; flagCanvas.height = 296;
    const ctx = flagCanvas.getContext('2d');
    ctx.fillStyle = '#a33e32'; ctx.fillRect(0, 0, 512, 296);
    ctx.fillStyle = '#e6cc91'; ctx.fillRect(0, 0, 512, 24); ctx.fillRect(0, 272, 512, 24);
    ctx.fillStyle = '#d6bb7d'; ctx.beginPath(); ctx.arc(230, 148, 66, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a33e32';
    // A simple pine emblem in the heraldic roundel.
    ctx.fillRect(219, 112, 22, 82); ctx.beginPath(); ctx.moveTo(230, 80); ctx.lineTo(187, 145); ctx.lineTo(210, 140); ctx.lineTo(183, 174); ctx.lineTo(277, 174); ctx.lineTo(250, 140); ctx.lineTo(273, 145); ctx.closePath(); ctx.fill();
    const flagTex = new THREE.CanvasTexture(flagCanvas); flagTex.colorSpace = THREE.SRGBColorSpace;
    const flagMat = new THREE.MeshStandardMaterial({ map: flagTex, side: THREE.DoubleSide, roughness: .82, metalness: .03 });
    const flag = new THREE.Mesh(flagGeo, flagMat); flag.position.set(poleX, poleTop - .08, poleZ); flag.castShadow = true; scene.add(flag);
    const flagBase = new Float32Array(pos.array);

    // Fixed target, gently orbiting camera: a full, unhurried look around the keep.
    const target = new THREE.Vector3(0, 8.2, 0);
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const angle = t * .075 + .48;
      const radius = innerWidth < 700 ? 64 : 57;
      camera.position.set(Math.cos(angle) * radius, 23 + Math.sin(t * .12) * .55, Math.sin(angle) * radius);
      camera.lookAt(target);
      for (let i = 0; i < pos.count; i++) {
        const x = flagBase[i * 3], y = flagBase[i * 3 + 1];
        const u = x / flagW;
        const envelope = Math.sin(u * Math.PI * .5);
        pos.setZ(i, envelope * (.34 * Math.sin(t * 3.0 - x * 1.8 + y * .55) + .10 * Math.sin(t * 4.1 - x * 3.1)));
        pos.setY(i, y + envelope * .11 * Math.sin(t * 2.5 - x * 1.4));
      }
      pos.needsUpdate = true; flagGeo.computeVertexNormals();
      renderer.render(scene, camera);
    }
    animate();
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
    addEventListener('webglcontextlost', e => { e.preventDefault(); document.querySelector('#error').style.display = 'grid'; }, false);
  </script>
</body>
</html>
